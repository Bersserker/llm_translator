[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tech-translator"
version = "0.1.0"
description = "Local technical document translation over an OpenAI-compatible API"
requires-python = ">=3.12"
dependencies = [
  "langchain-core>=1.0,<2", "langchain-openai>=1.0,<2", "openai>=2,<3",
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "typer>=0.15,<1",
  "httpx>=0.28,<1", "python-docx>=1.1,<2", "markdown-it-py>=3,<5", "PyYAML>=6,<7",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
tech-translator = "tech_translator.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires an explicitly enabled local LLM API"]
